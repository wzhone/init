name: Smoke CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

jobs:
  lint:
    name: Script lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install ShellCheck
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Bash syntax check
        run: |
          set -euxo pipefail
          bash -n el.sh
          bash -n alpine.sh

      - name: ShellCheck static analysis
        run: |
          set -euxo pipefail
          shellcheck -x el.sh alpine.sh

  systemd-smoke:
    name: ${{ matrix.name }} smoke
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: RHEL UBI 9
            image: registry.access.redhat.com/ubi9/ubi:latest
          - name: RHEL UBI 10
            image: registry.access.redhat.com/ubi10/ubi:latest
          - name: Rocky Linux 9
            image: rockylinux/rockylinux:9
          - name: Rocky Linux 10
            image: rockylinux/rockylinux:10
          - name: AlmaLinux 9
            image: almalinux:9
          - name: AlmaLinux 10
            image: almalinux:10
          - name: Oracle Linux 9
            image: oraclelinux:9
          - name: Oracle Linux 10
            image: oraclelinux:10
          - name: CentOS Stream 9
            image: quay.io/centos/centos:stream9
          - name: CentOS Stream 10
            image: quay.io/centos/centos:stream10
          - name: Debian 12
            image: debian:12
          - name: Debian 13
            image: debian:13
          - name: Ubuntu 24.04 LTS
            image: ubuntu:24.04
          - name: Ubuntu 26.04 LTS
            image: ubuntu:26.04
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install minimal dependencies
        run: |
          set -euxo pipefail
          if command -v dnf >/dev/null; then
            dnf -y install sudo iproute iputils ncurses procps-ng
          else
            apt-get update
            apt-get install -y sudo iproute2 iputils-ping ncurses-bin procps
          fi

      - name: Check OS support
        run: |
          set -euxo pipefail
          bash ./el.sh check_os

      - name: Render menu
        run: |
          set -euxo pipefail
          TERM=xterm bash ./el.sh show_menu > /tmp/el-menu
          grep -q "19. 系统检查" /tmp/el-menu

      - name: Run pre_check
        run: |
          set -euxo pipefail
          bash ./el.sh pre_check

  alpine-smoke:
    name: Alpine ${{ matrix.version }} smoke
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        version: ["3.23", "3.24"]
    container:
      image: alpine:${{ matrix.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install minimal dependencies
        run: |
          set -euxo pipefail
          apk add --no-cache bash curl iputils openrc

      - name: Check OS support
        run: |
          set -euxo pipefail
          bash ./alpine.sh check_os

      - name: Render menu
        run: |
          set -euxo pipefail
          TERM=xterm bash ./alpine.sh show_menu > /tmp/alpine-menu
          grep -q "15. 系统检查" /tmp/alpine-menu

      - name: Run pre_check
        run: |
          set -euxo pipefail
          bash ./alpine.sh pre_check
